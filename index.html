<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetTrade AI - Professional Trading Signals</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --buy-color: #00c853;
            --sell-color: #ff1744;
            --text-color: #f0f6fc;
            --accent-color: #2f81f7;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 0;
            color: var(--accent-color);
        }

        .upload-area {
            border: 2px dashed #30363d;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: var(--accent-color);
            background: rgba(47, 129, 247, 0.05);
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        #result {
            display: none;
            margin-top: 25px;
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .signal-badge {
            font-size: 20px;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .signal-BUY { background: rgba(0, 200, 83, 0.2); color: var(--buy-color); border: 1px solid var(--buy-color); }
        .signal-SELL { background: rgba(255, 23, 68, 0.2); color: var(--sell-color); border: 1px solid var(--sell-color); }

        .progress-box {
            margin: 15px 0;
        }

        .bar-container {
            height: 18px;
            background: var(--sell-color);
            border-radius: 9px;
            overflow: hidden;
            display: flex;
        }

        .buy-bar {
            height: 100%;
            background: var(--buy-color);
            width: 50%;
            transition: width 0.5s ease;
        }

        .bar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            margin-top: 6px;
        }

        .target-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .card {
            background: #21262d;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .card label {
            font-size: 11px;
            color: #8b949e;
            display: block;
        }

        .card val {
            font-size: 15px;
            font-weight: bold;
            margin-top: 4px;
            display: block;
        }

        .spinner {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ GETTRADE AI SIGNAL</h1>
    
    <div class="upload-area" onclick="document.getElementById('chartInput').click()">
        📁 Grafik Rasmini Yuklang
        <br><small style="color:#8b949e;">(PNG, JPG, TradingView screenshot)</small>
        <input type="file" id="chartInput" accept="image/*" onchange="previewFile()">
    </div>
    
    <div id="fileInfo" style="text-align:center; color:#8b949e; margin-bottom:10px;"></div>

    <button class="btn" onclick="startAnalysis()">ANALIZ QILISH</button>

    <div class="spinner" id="spinner">⏳ AI professional tahlil qilmoqda...</div>

    <div id="result">
        <div class="signal-header">
            <div>
                <span style="color:#8b949e; font-size:12px;">TREDER SIGNAL:</span><br>
                <span id="signalBadge" class="signal-badge">BUY</span>
            </div>
            <div style="text-align:right;">
                <span style="color:#8b949e; font-size:12px;">PROBABILITY:</span><br>
                <span id="winRate" style="font-size:18px; font-weight:bold; color:var(--accent-color);">85%</span>
            </div>
        </div>

        <div class="progress-box">
            <div class="bar-container">
                <div id="buyBar" class="buy-bar"></div>
            </div>
            <div class="bar-labels">
                <span style="color:var(--buy-color)">BUY: <span id="buyVal">70</span>%</span>
                <span style="color:var(--sell-color)">SELL: <span id="sellVal">30</span>%</span>
            </div>
        </div>

        <div class="card" style="margin-bottom: 10px;">
            <label>TENDENTSIYA & PATTERN:</label>
            <val id="patternVal" style="color:#2f81f7;">Support Bounce</val>
        </div>

        <div class="target-cards">
            <div class="card">
                <label>KIRISH (ENTRY):</label>
                <val id="entryVal">0.00</val>
            </div>
            <div class="card">
                <label>STOP LOSS (SL):</label>
                <val id="slVal" style="color:var(--sell-color);">0.00</val>
            </div>
            <div class="card">
                <label>TAKE PROFIT 1:</label>
                <val id="tp1Val" style="color:var(--buy-color);">0.00</val>
            </div>
            <div class="card">
                <label>TAKE PROFIT 2:</label>
                <val id="tp2Val" style="color:var(--buy-color);">0.00</val>
            </div>
        </div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://ai-trading-backend-0k52.onrender.com/analyze";

    function previewFile() {
        const file = document.getElementById('chartInput').files[0];
        if (file) {
            document.getElementById('fileInfo').innerText = "Tanlandi: " + file.name;
        }
    }

    async function startAnalysis() {
        const fileInput = document.getElementById('chartInput');
        if (!fileInput.files[0]) {
            alert("Iltimos, avval grafik rasmini yuklang!");
            return;
        }

        document.getElementById('spinner').style.display = 'block';
        document.getElementById('result').style.display = 'none';

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch(BACKEND_URL, {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            document.getElementById('spinner').style.display = 'none';

            if (response.ok) {
                const signalBadge = document.getElementById('signalBadge');
                signalBadge.innerText = data.signal + " (" + data.trend + ")";
                signalBadge.className = "signal-badge signal-" + data.signal;

                document.getElementById('winRate').innerText = data.win_rate_probability || "80%";
                document.getElementById('buyVal').innerText = data.buy_percentage;
                document.getElementById('sellVal').innerText = data.sell_percentage;
                document.getElementById('buyBar').style.width = data.buy_percentage + "%";

                document.getElementById('patternVal').innerText = data.pattern;
                document.getElementById('entryVal').innerText = data.entry_price;
                document.getElementById('slVal').innerText = data.stop_loss;
                document.getElementById('tp1Val').innerText = data.take_profit_1;
                document.getElementById('tp2Val').innerText = data.take_profit_2;

                document.getElementById('result').style.display = 'block';
            } else {
                alert("Xatolik: " + (data.detail || "Server xatosi"));
            }
        } catch (err) {
            document.getElementById('spinner').style.display = 'none';
            alert("Serverga ulanib bo'lmadi. Render uyg'onayotgan bo'lishi mumkin.");
        }
    }
</script>

</body>
</html>
