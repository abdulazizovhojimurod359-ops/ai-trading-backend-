<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Signal Analyzer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; text-align: center; color: #38bdf8; margin-bottom: 6px; }
        p.subtitle { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #3b82f6; padding: 20px; border-radius: 12px; text-align: center; background: #0f172a; cursor: pointer; }
        .upload-area input { display: none; }
        .upload-area i { font-size: 36px; color: #3b82f6; margin-bottom: 8px; }
        #preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; }
        button.btn-analyze { width: 100%; margin-top: 15px; padding: 14px; background: #2563eb; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .loader { display: none; text-align: center; margin-top: 20px; color: #f59e0b; }
        
        .result-box { margin-top: 20px; background: #0f172a; padding: 16px; border-radius: 12px; display: none; }
        .progress-container { margin: 15px 0; }
        .progress-labels { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        .progress-bar-bg { width: 100%; height: 16px; background: #ef4444; border-radius: 8px; overflow: hidden; display: flex; }
        .progress-bar-fill { height: 100%; background: #22c55e; transition: width 0.5s ease; }
        
        .prediction-card { background: #1e293b; border-left: 4px solid #38bdf8; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 13px; line-height: 1.4; color: #e2e8f0; }
        .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; }
        .buy-text { color: #22c55e; font-weight: bold; }
        .sell-text { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>📈 AI Trading Analyzer</h1>
    <p class="subtitle">Grafik rasmini yuklang va aniq signal oling</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <p id="uploadText">Grafik rasmini tanlang</p>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this)">
        <img id="preview" alt="Grafik Prevyu">
    </div>

    <button class="btn-analyze" onclick="startAnalysis()">Tahlil qilish</button>

    <div class="loader" id="loader">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 8px; font-size: 14px;">AI grafik va bashoratni hisoblamoqda...</p>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-row"><span>Valyuta:</span><span id="resPair" style="font-weight:bold;">-</span></div>
        
        <div class="progress-container">
            <div class="progress-labels">
                <span class="buy-text">BUY: <span id="buyPercent">0</span>%</span>
                <span class="sell-text">SELL: <span id="sellPercent">0</span>%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="buyBar" style="width: 50%;"></div>
            </div>
        </div>

        <div class="result-row"><span>Tavsiya qilingan yo'nalish:</span><span id="resDir" style="font-size: 18px;">-</span></div>
        <div class="result-row"><span>Kirish narxi (Entry):</span><span id="resEntry" style="color:#38bdf8;">-</span></div>
        <div class="result-row"><span>Stop Loss (SL):</span><span id="resSL" style="color:#ef4444;">-</span></div>
        <div class="result-row"><span>Take Profit (TP):</span><span id="resTP" style="color:#22c55e;">-</span></div>
        
        <div class="prediction-card">
            <strong style="color: #38bdf8; display: block; margin-bottom: 4px;">🔮 Grafik Bashorati:</strong>
            <span id="resPrediction">-</span>
        </div>
    </div>
</div>

<script>
    function handleFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('uploadText').innerText = "Rasm tanlandi";
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function startAnalysis() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) { alert("Iltimos, avval grafik rasmini tanlang!"); return; }

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const res = await fetch('https://ai-trading-backend-0k52.onrender.com/analyze', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            document.getElementById('resPair').innerText = data.pair || 'Noma\'lum';
            
            const buyPct = data.buy_percentage || 50;
            const sellPct = data.sell_percentage || 50;
            document.getElementById('buyPercent').innerText = buyPct;
            document.getElementById('sellPercent').innerText = sellPct;
            document.getElementById('buyBar').style.width = buyPct + '%';

            const dirEl = document.getElementById('resDir');
            dirEl.innerText = data.direction || '-';
            dirEl.className = data.direction === 'BUY' ? 'buy-text' : 'sell-text';

            document.getElementById('resEntry').innerText = data.entry || '-';
            document.getElementById('resSL').innerText = data.stop_loss || '-';
            document.getElementById('resTP').innerText = data.take_profit || '-';
            
            document.getElementById('resPrediction').innerText = data.prediction || 'Bashorat mavjud emas.';

            document.getElementById('resultBox').style.display = 'block';
        } catch (err) {
            alert("Xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring.");
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }
</script>
</body>
</html>
